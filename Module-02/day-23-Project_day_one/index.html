<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/1589a20b17.js" crossorigin="anonymous"></script>
    <title>Addis Deluxe</title>
</head>
<body>
    <header>
        <nav class="nav-bar">
            <div class="header">
                <img src="asset/pngtree-restaurant-logo-with-chef-hat-and-fork-spoon-symbol-png-image_17398231.png" alt="Logo" class="logo">
                <h3 id="name">Addis Deluxe</h3>
            </div>
            <div class="search">
                <form id="searchForm" class="search-container">
                    <input type="text" id="searchInput" placeholder="Search Our Menu...">
                </form>
                <div id="searchResults">

                </div>
            </div>   
        </nav>
    </header>
    <section class="container">
        <section class="menu">
            <main class="hero">
                <div class="menu-text">
                    <h1>Our Menu</h1>
                    <p>Authentic Ethiopian Flavours</p>
                </div>
                <div id="menu-filter">
                    <button class="filter" data-filter="all">All</button>
                    <button class="filter"  data-filter="vegan">Vegan</button>
                    <button class="filter" data-filter="main">Main</button>
                </div>
            </main>
            <section class="cards" id="cards">
                
            </section>
        </section>
        <aside class="simple-cart" id="simple-cart" aria-label="Your order">
            <h2>Your Cart</h2>
            <ul class="cart-items" id="cart-items">
                
            </ul>
        
            <div class="cart-item-list" id="sub-total">
                <ul>
                    <li>
                        <span>SubTotal:</span>
                        <strong id="subtotal-amount">$0.00</strong>
                    </li>
                    <li>
                        <span>Service Charge</span>
                        <strong id="service-charge-amount">$0.00</strong>
                    </li>
                </ul>
            </div>
        
            <div class="cart-total" id="cart-total">
                <span>Total:</span>
                <strong>$0.00</strong>
            </div>
        
            <button class="checkout" id="checkout">
                <p>Proceed To Checkout</p>
            </button>

            <!-- <button class="remove" id="remove">
                <p>Remove</p>
            </button> -->
        </aside>
        <div id="checkoutFormWrapper" style="display: none;">
            <form class="checkout-form" id="checkoutForm">
                <h2>Checkout</h2>
                <fieldset>
                    <legend>Contact Info</legend>
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" required />
                
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required />
                </fieldset>
            
                <fieldset>
                    <legend>Shipping Address</legend>
                    <label for="address">Street Address</label>
                    <input type="text" id="address" name="address" required />
            
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" required />
            
                    <label for="phone">Phone</label>
                    <input type="number" id="zip" name="phone" required />
                </fieldset>
                <div id="error_display">
                    
                </div>
                <button id="place_order" type="submit">Place Order</button>
            </form>
        </div>
    </section>
    <footer>
        <p><Address>Bole, Addis Ababa <br>
        Tel- 091122929292</Address></p>
    </footer>
    
    <script src="app.js"></script>
</body>
</html>
